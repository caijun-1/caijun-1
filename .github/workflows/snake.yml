name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23111111&color_dot_border=%23d4d4d4&color_dots=%23ffffff,%23ebebeb,%23d4d4d4,%23b5b5b5,%238c8c8c
            dist/github-snake-dark.svg?color_snake=%23f5f5f5&color_dot_border=%23333333&color_dots=%231e1e1e,%23363636,%23525252,%23737373,%23999999
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}