name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23d9382e&color_dots=%23eef2f5,%23b8d4e3,%236ba3c4,%232d6f9e,%2315426b
            dist/github-snake-dark.svg?color_snake=%23ff4d42&color_dots=%231b2430,%231e425e,%23296b96,%234ca3d9,%238ad4ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}